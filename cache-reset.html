<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>古堅南FC AI Coach キャッシュ更新</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#0f172a}
main{width:min(92%,560px);background:#fff;border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center}
h1{margin:0 0 12px;font-size:24px}.spinner{width:44px;height:44px;border:5px solid #dbeafe;border-top-color:#0284c7;border-radius:50%;margin:22px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}p{line-height:1.7;color:#475569}button{border:0;border-radius:10px;background:#0284c7;color:#fff;font-weight:800;padding:12px 18px;cursor:pointer}
small{display:block;margin-top:16px;color:#64748b}
</style>
</head>
<body>
<main>
<h1>⚽ Ver.18.2.2へ更新しています</h1>
<div class="spinner"></div>
<p id="status">古いPWAキャッシュとService Workerを削除しています。</p>
<button id="retry" hidden onclick="resetNow()">もう一度実行</button>
<small>通常は数秒で自動的に最新画面へ移動します。</small>
</main>
<script>
async function resetNow(){
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  retry.hidden=true;
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){await reg.unregister();}
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
    localStorage.setItem('furugen_cache_version','18.2.2');
    status.textContent='更新完了。最新のVer.18.2.2を開きます。';
    setTimeout(()=>location.replace('./?fresh=1822&t='+Date.now()),900);
  }catch(e){
    status.textContent='自動更新に失敗しました。「もう一度実行」を押してください。';
    retry.hidden=false;
  }
}
resetNow();
</script>
</body>
</html>
