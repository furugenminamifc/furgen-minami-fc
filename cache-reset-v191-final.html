<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Ver.19.1 完全版へ切替中</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#0f172a}
main{width:min(560px,90vw);background:#fff;border-radius:24px;padding:32px;box-shadow:0 18px 50px rgba(15,23,42,.14);text-align:center}
.spinner{width:46px;height:46px;border:5px solid #dbeafe;border-top-color:#0284c7;border-radius:50%;margin:18px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{border:0;border-radius:12px;background:#0284c7;color:#fff;font-weight:800;padding:12px 18px}
</style></head><body><main>
<h1>Ver.19.1 完全版へ切替中</h1><div class="spinner"></div>
<p id="msg">古いPWAキャッシュとService Workerを削除しています。</p>
<button id="go" hidden>完全版を開く</button>
</main><script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    localStorage.setItem('furugen_active_build','191-final-20260731');
    document.getElementById('msg').textContent='削除完了。完全版を開きます。';
  } catch(e) {
    document.getElementById('msg').textContent='切替処理を続行します。';
  }
  const target='./ver191-complete.html?build=191-final-20260731&t='+Date.now();
  document.getElementById('go').hidden=false;
  document.getElementById('go').onclick=()=>location.replace(target);
  setTimeout(()=>location.replace(target),1200);
})();
</script></body></html>
